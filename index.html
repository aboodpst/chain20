
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duo Blitz</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d20;color:white;font-family:Arial,sans-serif;text-align:center}
h1{font-size:38px;color:#39baff}
h1 span{color:#ff5ebd}
#score{font-size:25px;font-weight:bold;margin:12px}
canvas{width:min(96vw,900px);background:#101b3b;border:2px solid #6179bd;border-radius:12px;touch-action:none}
button{padding:12px 20px;margin:5px;border:0;border-radius:10px;background:#218eea;color:white;font-size:16px;font-weight:bold}
p{color:#c8d4f9}
</style>
</head>
<body>
<h1>DUO <span>BLITZ</span></h1>
<div id="score">🔵 <span id="blue">0</span> — <span id="pink">0</span> 🔴</div>
<canvas id="game" width="900" height="540"></canvas>
<p>Move: WASD / Arrow Keys · Pass: Q · Shoot: Space</p>
<button onclick="restart()">Restart Game</button>
<button onclick="pass()">PASS</button>
<button onclick="shoot()">SHOOT</button>
<p id="status">Get the ball and score 20 points to win!</p>
<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const W=900,H=540;
let keys={},blue=0,pink=0,ended=false;
let players=[],ball;

function setup(){
 players=[];
 for(let i=0;i<4;i++){
  players.push({team:0,id:i,x:130,y:100+i*105});
  players.push({team:1,id:i,x:770,y:100+i*105});
 }
 ball={x:450,y:270,vx:0,vy:0,owner:null};
}
function restart(){
 blue=0;pink=0;ended=false;
 document.getElementById("blue").textContent=0;
 document.getElementById("pink").textContent=0;
 document.getElementById("status").textContent="Match started!";
 setup();
}
onkeydown=e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.key.toLowerCase()==="q")pass();
 if(e.code==="Space"){e.preventDefault();shoot();}
};
onkeyup=e=>keys[e.key.toLowerCase()]=false;

function pass(){
 if(ended||!ball.owner||ball.owner.team!==0)return;
 const p=ball.owner;
 ball.owner=null;
 ball.x=p.x;ball.y=p.y;
 ball.vx=400;ball.vy=0;
}
function shoot(){
 if(ended||!ball.owner||ball.owner.team!==0)return;
 const p=ball.owner;
 ball.owner=null;
 ball.x=p.x;ball.y=p.y;
 ball.vx=600;ball.vy=(270-p.y)*1.1;
}
function score(team){
 if(team===0)blue+=2;else pink+=2;
 document.getElementById("blue").textContent=blue;
 document.getElementById("pink").textContent=pink;
 setup();
 if(blue>=20||pink>=20){
  ended=true;
  document.getElementById("status").textContent=
   blue>pink?"🔵 BLUE TEAM WINS!":"🔴 PINK TEAM WINS!";
 }else{
  document.getElementById("status").textContent=
   team===0?"BLUE SCORES +2!":"PINK SCORES +2!";
 }
}
function draw(){
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle="#101b3b";ctx.fillRect(0,0,W,H);
 ctx.strokeStyle="#7188c7";ctx.lineWidth=3;
 ctx.strokeRect(22,22,W-44,H-44);
 ctx.beginPath();ctx.moveTo(450,22);ctx.lineTo(450,518);
 ctx.arc(450,270,65,0,Math.PI*2);ctx.stroke();
 ctx.fillStyle="#38baff";ctx.fillRect(10,205,14,130);
 ctx.fillStyle="#ff5ebd";ctx.fillRect(876,205,14,130);

 if(!ended){
  let controlled=ball.owner&&ball.owner.team===0?ball.owner:
    players.find(p=>p.team===0&&p.id===0);
  if(ball.owner===controlled){
   controlled.x+=((keys.d||keys.arrowright)?1:0)*3.5;
   controlled.x-=((keys.a||keys.arrowleft)?1:0)*3.5;
   controlled.y+=((keys.s||keys.arrowdown)?1:0)*3.5;
   controlled.y-=((keys.w||keys.arrowup)?1:0)*3.5;
   controlled.x=Math.max(35,Math.min(865,controlled.x));
   controlled.y=Math.max(40,Math.min(500,controlled.y));
  }
  for(const p of players.filter(p=>p.team===1)){
   const target=ball.owner||ball;
   let dx=target.x-p.x,dy=target.y-p.y,d=Math.hypot(dx,dy)||1;
   p.x+=dx/d*1.25;p.y+=dy/d*1.25;
   if(d<20&&!ball.owner){
    ball.owner=p;
    ball.vx=ball.vy=0;
   }
  }
  if(!ball.owner){
   ball.x+=ball.vx/60;ball.y+=ball.vy/60;
   ball.vx*=.99;ball.vy*=.99;
   if(ball.y<30||ball.y>510)ball.vy*=-.8;
   if(ball.x<20){score(1);}
   if(ball.x>880){score(0);}
   if(!ball.owner){
    for(const p of players){
     if(Math.hypot(p.x-ball.x,p.y-ball.y)<19&&Math.hypot(ball.vx,ball.vy)<250){
      ball.owner=p;ball.vx=ball.vy=0;break;
     }
    }
   }
  }else{
   ball.x=ball.owner.x+(ball.owner.team===0?18:-18);
   ball.y=ball.owner.y+5;
  }
 }

 for(const p of players){
  ctx.fillStyle=p.team===0?"#258fe5":"#f04da8";
  ctx.beginPath();ctx.ellipse(p.x,p.y,17,21,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#ffdbc9";ctx.beginPath();ctx.arc(p.x,p.y-17,11,0,7);ctx.fill();
  ctx.fillStyle="#352443";ctx.beginPath();ctx.arc(p.x,p.y-20,12,Math.PI,Math.PI*2);ctx.fill();
  ctx.fillStyle="white";ctx.font="bold 12px Arial";
  ctx.fillText(p.id+1,p.x-3,p.y+5);
  if(ball.owner===p){ctx.strokeStyle="white";ctx.beginPath();ctx.arc(p.x,p.y,25,0,7);ctx.stroke();}
 }
 ctx.fillStyle="white";ctx.beginPath();ctx.arc(ball.x,ball.y,9,0,7);ctx.fill();
 requestAnimationFrame(draw);
}
setup();draw();
</script>
</body>
</html>
